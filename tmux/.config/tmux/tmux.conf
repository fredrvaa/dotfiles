# Set true colors
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g default-shell /bin/zsh

# Set prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Enable mouse
set -g mouse on

# Set window start-index to 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on 

# Change yank flow
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

# Catppuccin (current API — options must be set before tpm sources the plugin)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_background 'none'
set -g @catppuccin_date_time_text '%Y-%m-%d %H:%M'

run '~/.tmux/plugins/tpm/tpm'

# Status bar (references catppuccin modules — must come after tpm/catppuccin loads)
set -g status-bg default
set -g status-style bg=default
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -gF status-right '#{E:@catppuccin_status_directory}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

